<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="gaugeArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="45%" stop-color="#ffd666"/>
      <stop offset="100%" stop-color="#2cb67d"/>
    </linearGradient>
    <filter id="needleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="320" rx="18" fill="url(#gaugeBg)"/>
  <text x="300" y="34" font-size="14" fill="#a7a9be" text-anchor="middle">Every run scores the account — deliberate exceptions don't hide the finding</text>

  <path d="M90,250 A210,210 0 0 1 510,250" fill="none" stroke="url(#gaugeArc)" stroke-width="16" stroke-linecap="round"/>
  <text x="90" y="278" font-size="12" fill="#6f6d8c" text-anchor="middle">0</text>
  <text x="510" y="278" font-size="12" fill="#6f6d8c" text-anchor="middle">100</text>

  <!-- needle (filter lives on the group, not the line itself — a perfectly
       vertical line has a zero-width bounding box, and a filter referencing
       a zero-size bbox is disabled per spec, which silently hides the whole
       element regardless of the rotation animated onto it) -->
  <g filter="url(#needleGlow)">
    <line x1="300" y1="250" x2="300" y2="90" stroke="#fffffe" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="-72 300 250;-72 300 250;46 300 250;46 300 250;-72 300 250"
        keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    </line>
    <circle cx="300" cy="250" r="10" fill="#161a22" stroke="#7f5af0" stroke-width="2"/>
  </g>

  <!-- low score readout -->
  <g text-anchor="middle">
    <text x="300" y="190" font-size="46" font-weight="bold" fill="#ff7a45">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
      64
    </text>
    <text x="300" y="216" font-size="16" fill="#ff7a45">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
      grade D — S3.1 flagged
    </text>
  </g>

  <!-- high score readout -->
  <g text-anchor="middle">
    <text x="300" y="190" font-size="46" font-weight="bold" fill="#2cb67d">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
      94
    </text>
    <text x="300" y="216" font-size="16" fill="#2cb67d">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
      grade A — risk accepted, not hidden
    </text>
  </g>

  <text x="300" y="300" font-size="12" fill="#6f6d8c" text-anchor="middle">--accept-risk-file accepted-risks.json</text>
</svg>
