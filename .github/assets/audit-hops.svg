<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="hopPath" d="M60,110 L171,75 L282,135 L394,80 L505,140 L616,85 L728,130 L839,110" fill="none"/>
  </defs>

  <rect x="0" y="0" width="900" height="220" rx="18" fill="url(#bg)"/>

  <!-- connecting path -->
  <path d="M60,110 L171,75 L282,135 L394,80 L505,140 L616,85 L728,130 L839,110"
        fill="none" stroke="#3d3a6b" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- node 0: IAM -->
  <g>
    <rect x="25" y="75" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="60" cy="110" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="122" font-size="30" text-anchor="middle">🔑</text>
    <text x="60" y="168" font-size="12" fill="#a7a9be" text-anchor="middle">IAM</text>
  </g>

  <!-- node 1: S3 -->
  <g>
    <rect x="136" y="40" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="171" cy="75" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="171" y="87" font-size="30" text-anchor="middle">🪣</text>
    <text x="171" y="133" font-size="12" fill="#a7a9be" text-anchor="middle">S3</text>
  </g>

  <!-- node 2: EC2 -->
  <g>
    <rect x="247" y="100" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="282" cy="135" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="282" y="147" font-size="30" text-anchor="middle">🖥️</text>
    <text x="282" y="193" font-size="12" fill="#a7a9be" text-anchor="middle">EC2</text>
  </g>

  <!-- node 3: RDS -->
  <g>
    <rect x="359" y="45" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="394" cy="80" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="394" y="92" font-size="30" text-anchor="middle">🗄️</text>
    <text x="394" y="138" font-size="12" fill="#a7a9be" text-anchor="middle">RDS</text>
  </g>

  <!-- node 4: CloudTrail -->
  <g>
    <rect x="470" y="105" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="505" cy="140" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <text x="505" y="152" font-size="30" text-anchor="middle">📜</text>
    <text x="505" y="198" font-size="11" fill="#a7a9be" text-anchor="middle">CloudTrail</text>
  </g>

  <!-- node 5: Config -->
  <g>
    <rect x="581" y="50" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="616" cy="85" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <text x="616" y="97" font-size="30" text-anchor="middle">⚙️</text>
    <text x="616" y="143" font-size="12" fill="#a7a9be" text-anchor="middle">Config</text>
  </g>

  <!-- node 6: GuardDuty -->
  <g>
    <rect x="693" y="95" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="728" cy="130" r="34" fill="#7f5af0" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <text x="728" y="142" font-size="30" text-anchor="middle">🛡️</text>
    <text x="728" y="188" font-size="11" fill="#a7a9be" text-anchor="middle">GuardDuty</text>
  </g>

  <!-- node 7: Report (destination) -->
  <g>
    <rect x="800" y="75" width="78" height="70" rx="14" fill="#161a22" stroke="#2cb67d" stroke-width="1.5"/>
    <circle cx="839" cy="110" r="38" fill="#2cb67d" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="7s" repeatCount="indefinite"/>
    </circle>
    <text x="839" y="122" font-size="30" text-anchor="middle">📋</text>
    <text x="839" y="168" font-size="11" fill="#7ee8b8" text-anchor="middle">Report</text>
  </g>

  <!-- traveling pulse -->
  <circle r="7" fill="#fffffe" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear">
      <mpath xlink:href="#hopPath" href="#hopPath"/>
    </animateMotion>
    <animate attributeName="fill" values="#fffffe;#7f5af0;#fffffe" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
