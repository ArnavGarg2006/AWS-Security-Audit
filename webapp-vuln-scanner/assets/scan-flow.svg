<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="glow5" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="scanPath" d="M90,120 L450,120 L810,120" fill="none"/>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="18" fill="url(#bg5)"/>
  <path d="M90,120 L450,120 L810,120" fill="none" stroke="#3d3a6b" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- node 0: scanner -->
  <g>
    <rect x="55" y="85" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="90" cy="120" r="34" fill="#7f5af0" opacity="0" filter="url(#glow5)">
      <animate attributeName="opacity" values="0;0.55;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="132" font-size="28" text-anchor="middle">🔎</text>
    <text x="90" y="178" font-size="11" fill="#a7a9be" text-anchor="middle">scanner.py</text>
  </g>

  <!-- node 1: target -->
  <g>
    <rect x="415" y="85" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="450" cy="120" r="34" fill="#7f5af0" opacity="0" filter="url(#glow5)">
      <animate attributeName="opacity" values="0;0.55;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="132" font-size="28" text-anchor="middle">🎯</text>
    <text x="450" y="178" font-size="10" fill="#a7a9be" text-anchor="middle">frontend + API</text>
  </g>

  <!-- node 2: findings (destination) -->
  <g>
    <rect x="771" y="85" width="78" height="70" rx="14" fill="#161a22" stroke="#ff7a45" stroke-width="1.5"/>
    <circle cx="810" cy="120" r="38" fill="#ff7a45" opacity="0" filter="url(#glow5)">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="810" y="132" font-size="28" text-anchor="middle">📋</text>
    <text x="810" y="178" font-size="10" fill="#ffb08a" text-anchor="middle">findings</text>
  </g>

  <!-- before/after stat -->
  <text x="600" y="50" font-size="13" text-anchor="middle" fill="#a7a9be" text-decoration="line-through">12 findings</text>
  <text x="600" y="72" font-size="20" text-anchor="middle" fill="#ffb08a" font-weight="bold">→ 7 findings</text>
  <text x="600" y="92" font-size="10" text-anchor="middle" fill="#7ee8b8">after fixing what code could fix</text>

  <!-- traveling pulse -->
  <circle r="6" fill="#fffffe" filter="url(#glow5)">
    <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="linear">
      <mpath xlink:href="#scanPath" href="#scanPath"/>
    </animateMotion>
    <animate attributeName="fill" values="#fffffe;#7f5af0;#fffffe" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
