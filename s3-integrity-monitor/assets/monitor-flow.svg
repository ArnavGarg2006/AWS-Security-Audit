<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="glow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="monPath" d="M60,120 L290,80 L520,150 L819,120" fill="none"/>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="18" fill="url(#bg3)"/>
  <path d="M60,120 L290,80 L520,150 L819,120" fill="none" stroke="#3d3a6b" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M290,80 L520,32" fill="none" stroke="#3d3a6b" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- node 0: S3 bucket -->
  <g>
    <rect x="25" y="85" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="60" cy="120" r="34" fill="#7f5af0" opacity="0" filter="url(#glow3)">
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="132" font-size="28" text-anchor="middle">🪣</text>
    <text x="60" y="178" font-size="11" fill="#a7a9be" text-anchor="middle">S3 event</text>
  </g>

  <!-- node 1: Lambda -->
  <g>
    <rect x="255" y="45" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="290" cy="80" r="34" fill="#7f5af0" opacity="0" filter="url(#glow3)">
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="290" y="92" font-size="28" text-anchor="middle">⚡</text>
    <text x="290" y="138" font-size="11" fill="#a7a9be" text-anchor="middle">Lambda</text>
  </g>

  <!-- node 2: DynamoDB -->
  <g>
    <rect x="485" y="115" width="70" height="70" rx="14" fill="#161a22" stroke="#2a2f3a"/>
    <circle cx="520" cy="150" r="34" fill="#7f5af0" opacity="0" filter="url(#glow3)">
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="162" font-size="28" text-anchor="middle">🗄️</text>
    <text x="520" y="208" font-size="10" fill="#a7a9be" text-anchor="middle">Compare ETag</text>
  </g>

  <!-- node 3: Recorded (destination) -->
  <g>
    <rect x="780" y="85" width="78" height="70" rx="14" fill="#161a22" stroke="#2cb67d" stroke-width="1.5"/>
    <circle cx="819" cy="120" r="38" fill="#2cb67d" opacity="0" filter="url(#glow3)">
      <animate attributeName="opacity" values="0;0.65;0" dur="3s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="819" y="132" font-size="28" text-anchor="middle">📝</text>
    <text x="819" y="178" font-size="10" fill="#7ee8b8" text-anchor="middle">Recorded</text>
  </g>

  <!-- SNS alert (independent gentle pulse - the rare/critical path) -->
  <g>
    <rect x="485" y="2" width="70" height="55" rx="12" fill="#161a22" stroke="#ff4d4f" stroke-width="1.2"/>
    <circle cx="520" cy="26" r="4" fill="#ff4d4f">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="35" font-size="20" text-anchor="middle">🚨</text>
  </g>
  <text x="600" y="20" font-size="10" fill="#ff9b9b" text-anchor="start">SNS alert if MODIFIED/DELETED</text>

  <!-- traveling pulse -->
  <circle r="6" fill="#fffffe" filter="url(#glow3)">
    <animateMotion dur="3s" repeatCount="indefinite" calcMode="linear">
      <mpath xlink:href="#monPath" href="#monPath"/>
    </animateMotion>
    <animate attributeName="fill" values="#fffffe;#7f5af0;#fffffe" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
